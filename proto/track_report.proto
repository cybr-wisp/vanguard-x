syntax = "proto3";

package com.vanguard;

option java_package = "com.vanguard.pipeline.proto";
option java_outer_classname = "TelemetryProtos";
option java_multiple_files = true;

// Single position report from a simulated radar source.
message TrackReport {
  string track_id    = 1;
  double latitude    = 2;
  double longitude   = 3;
  double altitude    = 4;
  double velocity    = 5;
  double heading     = 6;
  int64  timestamp_ms = 7;
  TrackType type     = 8;

  enum TrackType {
    UNKNOWN    = 0;
    FRIENDLY   = 1;
    HOSTILE    = 2;
    NEUTRAL    = 3;
    COMMERCIAL = 4;
  }
}

// Batch wrapper for higher wire throughput.
message TrackBatch {
  repeated TrackReport reports = 1;
  int64 batch_timestamp_ms     = 2;
  string source_id             = 3;
}

// Alert fired when a track violates a geofence boundary.
message GeofenceAlert {
  string alert_id   = 1;
  string track_id   = 2;
  string zone_id    = 3;
  int64  timestamp_ms = 4;

  AlertLevel level = 5;

  double track_lat  = 6;
  double track_lon  = 7;
  double distance_to_boundary_m = 8;

  enum AlertLevel {
    ADVISORY = 0;
    WARNING  = 1;
    BREACH   = 2;
  }
}
