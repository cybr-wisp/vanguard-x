server:
  port: 8080

spring:
  application:
    name: vanguard-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Kafka consumer for reading track/event updates
vanguard:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  tracking:
    consumer-group: vanguard-api-readers

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
