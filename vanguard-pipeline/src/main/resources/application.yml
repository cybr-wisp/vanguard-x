server:
  port: 8080

spring:
  application:
    name: vanguard-pipeline

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: vanguard-pipeline
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  # PostGIS (disabled until Week 4)
  datasource:
    url: jdbc:postgresql://${POSTGIS_HOST:localhost}:5432/vanguard
    username: vanguard
    password: vanguard_dev
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ── VANGUARD-X ────────────────────────────────────────────────────
vanguard:
  ingestion:
    udp-port: ${INGESTION_UDP_PORT:5150}
  filtering:
    ekf:
      process-noise: 0.1
      measurement-noise: 1.0
  geofence:
    alert-buffer-meters: 500
    dedup-window-seconds: 30
  dashboard:
    websocket-fps: 10
