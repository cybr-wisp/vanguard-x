syntax = "proto3";
package vanguard;

option java_package = "com.vanguard.protocol";
option java_outer_classname = "SensorReportProto";

message SensorReport {
    string sensor_id = 1;
    int64 timestamp_ms = 2;

    // sensor position (known, fixed)
    double sensor_x = 3;
    double sensor_y = 4;

    // raw radar observation in polar coordinates (noisy)
    double range = 5;
    double azimuth = 6;

    // observation quality
    double signal_strength = 7;
    int64 sequence_number = 8;
}
