
syntax = "proto3";
package vanguard;

option java_package = "com.vanguard.protocol";
option java_outer_classname = "FusedTrackProto";

message FusedTrack {
    string track_id = 1;
    int64 timestamp_ms = 2;

    // filtered state estimate
    double x = 3;
    double y = 4;
    double vx = 5;
    double vy = 6;

    // covariance diagonal (uncertainty in each state variable)
    double cov_xx = 7;
    double cov_yy = 8;
    double cov_vxvx = 9;
    double cov_vyvy = 10;

    // track metadata
    TrackState state = 11;
    int32 update_count = 12;
    int32 contributing_sensors = 13;

    enum TrackState {
        TENTATIVE = 0;
        CONFIRMED = 1;
        COASTING = 2;
    }
}