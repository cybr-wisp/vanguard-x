services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7.2-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  vanguard-api:
    build:
      context: .
      dockerfile: vanguard-api/Dockerfile

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEMO_ENABLED: "false"

    ports:
      - "8081:8081"
      - "5000:5000/udp"

  vanguard-ui:
    build:
      context: ./vanguard-ui
      dockerfile: Dockerfile

    depends_on:
      - vanguard-api

    ports:
      - "3000:8080"

  prometheus:
    image: prom/prometheus:v2.53.0

    depends_on:
      - vanguard-api

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_PASSWORD: vanguard

    ports:
      - "3001:3000"
